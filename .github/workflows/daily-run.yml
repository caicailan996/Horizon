name: Horizon Daily Run

on:
  workflow_dispatch:
  # schedule:
  #  - cron: '0 22 * * *'

permissions:
  contents: write

jobs:
  run-horizon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.12'  # 显式指定为 3.12

      - name: Test API Connection
        env:
          CAIH_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Testing connection..."
          curl -i -X POST https://tokenapi.caih.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CAIH_KEY" \
            -d '{"model": "deepseek/deepseek-v4-1-flash", "messages": [{"role": "user", "content": "hello"}], "max_tokens": 5}'

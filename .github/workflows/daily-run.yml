name: Horizon Daily Run

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:      # <-- 新增这两行
  contents: write # <-- 新增这两行

jobs:
  run-horizon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Run Horizon
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: |
          uv sync
          uv run horizon --config data/config.github.json

      - name: Commit and push generated summaries
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-generate Horizon daily summary"
          file_pattern: "data/summaries/* docs/_posts/*"

name: Horizon Daily Run

on:
  workflow_dispatch:
  # schedule:
  #  - cron: '0 22 * * *'

permissions:
  contents: write

jobs:
  run-horizon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.12'  # 显式指定为 3.12

        

      - name: Run Horizon
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }} # <-- 确保添加了这一行
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: |
          sudo apt-get update  # 新增：安装 libxml2 和 libxslt 开发包
          sudo apt-get install -y libxml2-dev libxslt1-dev
          
          uv sync
          uv run horizon --config data/config.github.json  --log-level INFO

      - name: Commit and push generated summaries manually
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f docs/_posts/* data/summaries/*
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-generate Horizon daily summary" && git push)
